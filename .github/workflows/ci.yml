name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Install C compiler (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y gcc

      # Windows runners ship with MinGW but no sqlite3 headers, and the
      # default PowerShell context can't resolve POSIX paths like
      # /mingw64/include when CGO calls gcc. We install the matched
      # mingw-w64 toolchain via MSYS2 and run the Go build *through*
      # msys2 {0} so gcc sees its own POSIX filesystem and finds the
      # headers under /mingw64/include automatically.
      - name: Set up MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-pkg-config

      - name: Download dependencies
        run: go mod download

      # Two Build / Test pairs — same go commands, different shell. On
      # Windows the msys2 shell makes gcc's default include path
      # (/mingw64/include) just work without any CGO_CFLAGS plumbing.

      - name: Build
        if: matrix.os != 'windows-latest'
        env:
          CGO_ENABLED: 1
        run: go build ./...

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        env:
          CGO_ENABLED: 1
        run: go build ./...

      - name: Test
        if: matrix.os != 'windows-latest'
        env:
          CGO_ENABLED: 1
        run: go test -race -coverprofile=coverage.out ./...

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        env:
          CGO_ENABLED: 1
        run: go test -race ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out

  # The Postgres adapter tests skip without INODE_TEST_PG_DSN. This job runs
  # them against the same pgvector image as docker-compose.yml, and fails if
  # any of them skipped. Service containers need a Linux runner.
  postgres:
    name: Postgres tests
    runs-on: ubuntu-latest

    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Test
        shell: bash # -o pipefail, so a failing go test is not hidden by tee
        env:
          CGO_ENABLED: 1
          INODE_TEST_PG_DSN: postgres://postgres:password@localhost:5432/postgres?sslmode=disable
        run: |
          go test -race -count=1 -v -run Postgres ./internal/adapters/db/ | tee test.out
          if grep -q -- '--- SKIP' test.out; then echo "Postgres tests skipped"; exit 1; fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  govulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # Reports only vulnerabilities in code paths inode actually calls.
      # CGO is needed so the SQLite adapter (sqlite-vec cgo bindings) is analysed.
      - name: govulncheck
        env:
          CGO_ENABLED: 1
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
