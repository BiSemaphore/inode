name: Release

# Triggered by tag push (`git push origin vX.Y.Z`) or manually from the
# Actions UI. Manual dispatch is useful for re-running after a fix
# without having to delete and re-push tags.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # When run via workflow_dispatch, check out the supplied tag.
          # On push: tags, github.ref already points at the tag.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # A release build must not change go.mod or go.sum; fail instead.
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # The release page shows the tag's CHANGELOG section. A missing or
      # empty section fails here, before anything is published.
      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 1
