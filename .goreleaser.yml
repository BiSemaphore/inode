version: 2

project_name: inode

builds:
  - id: inode
    main: ./main.go
    binary: inode
    env:
      - CGO_ENABLED=1
    # v0.2.x publishes Linux amd64 only. Other targets (macOS, Windows,
    # Linux arm64) need cross-compilation infra (mingw-w64, osxcross/zig,
    # gcc-aarch64-linux-gnu with goreleaser per-arch env) that's heavier
    # than a solo hobby project warrants right now. Affected users:
    # `go install github.com/BiSemaphore/inode@latest`. Re-add archs/OSes
    # as people actually ask for them.
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/BiSemaphore/inode/internal/version.Version={{.Version}}
      - -X github.com/BiSemaphore/inode/internal/version.Commit={{.Commit}}
      - -X github.com/BiSemaphore/inode/internal/version.Date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Release notes come from the CHANGELOG section for the tag
# (scripts/release-notes.sh, passed as --release-notes by release.yml).
# Do not set `changelog.disable`: it also skips loading --release-notes,
# which published v0.5.0 with an empty page. With --release-notes set,
# goreleaser does not generate notes from commits.

release:
  github:
    owner: BiSemaphore
    name: inode
  name_template: "v{{ .Version }}"
  footer: |
    ---
    **Full Changelog**: https://github.com/BiSemaphore/inode/blob/main/CHANGELOG.md
